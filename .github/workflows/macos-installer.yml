name: Build and smoke-test standalone Apple Silicon Mac package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-installer:
    # Standard ARM64 runner; no paid larger-runner label or Apple credentials.
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop-ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            desktop-ui/scripts/requirements-macos-build.txt
      - name: Verify Apple Silicon runner and install frozen-engine dependencies
        run: |
          test "$(uname -m)" = arm64
          echo "MPLCONFIGDIR=$RUNNER_TEMP/elisa-matplotlib" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/elisa-cache" >> "$GITHUB_ENV"
          python -m pip install --only-binary=:all: -r desktop-ui/scripts/requirements-macos-build.txt
          python -m pip check
      - name: Test Python science and packaging validation
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s desktop-ui/scripts -p 'test_*packaging.py' -v
      - name: Install and verify the frontend
        working-directory: desktop-ui
        run: |
          npm ci
          npm run lint
          npm test
          npm run test:integration
          npm run test:plate-science
      - name: Install the official ARM64 Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add aarch64-apple-darwin
      - name: Build standalone ad-hoc-signed Apple Silicon app
        working-directory: desktop-ui
        run: npm run tauri:build -- --ci --target aarch64-apple-darwin --bundles app -- --locked
      - name: Test native storage and window sizing
        working-directory: desktop-ui/src-tauri
        run: cargo test --locked --target aarch64-apple-darwin
      - name: Record dependencies and verify copied app, engine, native launch and DMG
        run: |
          mkdir -p desktop-ui/artifacts/macos
          python -m pip freeze --all > desktop-ui/artifacts/macos/python-build-environment.txt
          npm ls --prefix desktop-ui --depth=0 --json > desktop-ui/artifacts/macos/npm-build-environment.json
          rustc --version > desktop-ui/artifacts/macos/rust-build-environment.txt
          python desktop-ui/scripts/macos-package-smoke.py \
            --app desktop-ui/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/ElisaCalculator.app \
            --output desktop-ui/artifacts/macos
          echo '### Standalone Apple Silicon Mac package' >> "$GITHUB_STEP_SUMMARY"
          echo 'ARM64 app and frozen Python engine, numerical/PNG/export contracts, native visible-window startup, ad-hoc signature and mounted DMG content verified. No Developer ID signing or Apple notarization. Physical M1 iMac and quarantined clean-machine acceptance remain separate.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload exact-commit Mac package and verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: ElisaCalculator-macos-arm64-${{ github.sha }}
          path: desktop-ui/artifacts/macos/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Preserve diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ElisaCalculator-macos-diagnostics-${{ github.sha }}
          path: desktop-ui/artifacts/macos/
          if-no-files-found: ignore
          retention-days: 14
